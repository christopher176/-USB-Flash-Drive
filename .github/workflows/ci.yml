name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agent-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m venv agent/.venv
          agent/.venv/bin/pip install --upgrade pip
          agent/.venv/bin/pip install -r agent/requirements-dev.txt
      - name: Run test-suite
        run: cd agent && .venv/bin/python -m pytest tests/ -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: cd frontend && npm ci || npm install
      - name: Build (type-check + vite build)
        run: cd frontend && npm run build

  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: true   # signal-only: new CVEs shouldn't block unrelated PRs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r agent/requirements.txt
      - name: npm audit
        run: cd frontend && npm install && npm audit --omit=dev --audit-level=high
